name: Debug APK

# Builds an installable debug APK (signed with the debug key) and keeps it as a download on the run's page.
# Run it from the Actions tab (Run workflow), or it runs on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: alder-debug-apk
          path: app/build/outputs/apk/debug/*.apk
